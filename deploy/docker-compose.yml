# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
# Settings come from the repo's .env (DOMAIN is used by Caddy).

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      APP_ENV: production
    volumes:
      - ../data:/app/data
      - ../media:/app/media
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10.2
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../media/public:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
