<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedler</title>
    <script>
      // Before first paint, so a dark-mode load never flashes light.
      try {
        var saved = localStorage.getItem('schedler.theme')
      } catch (e) {}
      var dark =
        saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
